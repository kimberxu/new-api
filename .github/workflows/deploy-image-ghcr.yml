name: Build branch image (GHCR)

on:
  push:
    tags:
      - 'personal*'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (personal)"
        required: true
        default: "personal"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.sha }}

      - name: Resolve image tags
        id: tags
        env:
          DISPATCH_BRANCH: ${{ inputs.branch }}
        run: |
          OWNER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${OWNER}/new-api"
          # 镜像 tag 前缀来源：手动触发用 branch 输入；tag 触发用 tag 名去 -image 后缀
          # （personal-image → personal）
          if [ -n "$DISPATCH_BRANCH" ]; then
            RAW_PREFIX="$DISPATCH_BRANCH"
          else
            RAW_PREFIX="${GITHUB_REF_NAME%-image}"
          fi
          PREFIX=$(printf '%s' "$RAW_PREFIX" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          if [ -z "$PREFIX" ]; then
            echo "::error::无法推导合法镜像 tag 前缀（来源: $RAW_PREFIX）"
            exit 1
          fi
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "rolling_tag=${IMAGE}:${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${PREFIX}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${PREFIX}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: echo "${{ steps.tags.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.tags.outputs.image }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.rolling_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.rolling_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old image versions (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_PREFIX: ${{ steps.tags.outputs.prefix }}
        run: |
          set -euo pipefail
          IMAGE="new-api"
          KEEP=3
          SUMMARY="$GITHUB_STEP_SUMMARY"
          # 优先 user-scoped API；失败时降级 repo-scoped API
          if ! gh api --paginate "/user/packages/container/${IMAGE}/versions?per_page=100" > /tmp/versions.json 2>/dev/null; then
            gh api --paginate "/repos/${GH_REPO}/packages/container/${IMAGE}/versions?per_page=100" > /tmp/versions.json 2>/tmp/prune_fetch_err.txt || {
              echo "::warning::无法列出镜像版本 ($(cat /tmp/prune_fetch_err.txt))，跳过清理"
              exit 0
            }
          fi
          # 每次构建在 GHCR 产生 1 个带 tag 的主 digest + 2 个无 tag 的平台辅助 digest。
          # 只有带本次构建前缀（IMAGE_PREFIX，即 personal）tag 的 version 才是可回滚版本；
          # 无 tag 辅助 digest 不占名额。各分支前缀家族独立计数、互不挤占。
          # 带 tag 版本独立编号，按创建时间倒序保留最近 KEEP 个（滚动 tag holder 恒为最新，
          # 必在被保留之列；仍显式保护以防异常）。
          # 注意：无 tag 平台辅助 digest 是被带 tag index 引用的子 manifest（amd64 平台 manifest、
          # attestation manifest）。删除它们会让 index 悬空，docker pull 报 manifest unknown
          # （2026-08-15 事故根因，见 docs/request-debug-customization-manifest.md「GHCR 镜像自动清理」）。
          # 因此一律跳过，只清理带 tag 版本；孤儿 manifest 仅数 KB，可忽略。
          jq -r --arg p "$IMAGE_PREFIX" '
            sort_by(.created_at) | reverse
            | [.[] | select((.metadata.container.tags // []) | any(startswith($p)))] as $tagged
            | ($tagged | to_entries | map(
                .value as $v
                | ($v.metadata.container.tags // []) as $tags
                | (if (.key + 1) <= '"$KEEP"' or ($tags | index($p) != null)
                   then "KEEP" else "DELETE" end) as $a
                | "\($a)|\($v.id)|\($tags | join(","))|\($v.created_at)"
              ))
            | .[]
          ' /tmp/versions.json > /tmp/prune_plan.tsv 2>/tmp/prune_jq_err.txt || {
            echo "::warning::解析版本列表失败 ($(cat /tmp/prune_jq_err.txt))，跳过清理"
            exit 0
          }
          total=$(wc -l < /tmp/prune_plan.tsv)
          echo "发现 ${total} 个带 ${IMAGE_PREFIX} tag 的镜像版本"
          echo "### Prune old image versions (prefix ${IMAGE_PREFIX}, keep newest ${KEEP} tagged)" >> "$SUMMARY"
          echo "共 ${total} 个带 ${IMAGE_PREFIX} tag 的镜像版本（按创建时间倒序）" >> "$SUMMARY"
          echo '```' >> "$SUMMARY"
          cat /tmp/prune_plan.tsv >> "$SUMMARY"
          deleted=0
          while IFS='|' read -r action id tags created; do
            if [ "$action" = "KEEP" ]; then
              echo "保留 version $id (tags: $tags, created: $created)"
              continue
            fi
            echo "删除 version $id (tags: $tags, created: $created)"
            if gh api --method DELETE "/user/packages/container/${IMAGE}/versions/${id}" --silent 2>/tmp/prune_del_err.txt \
                || gh api --method DELETE "/repos/${GH_REPO}/packages/container/${IMAGE}/versions/${id}" --silent 2>>/tmp/prune_del_err.txt; then
              deleted=$((deleted + 1))
              echo "DELETED version $id" >> "$SUMMARY"
            else
              echo "::warning::删除 version $id 失败: $(tail -1 /tmp/prune_del_err.txt)"
            fi
          done < /tmp/prune_plan.tsv
          echo '```' >> "$SUMMARY"
          echo "共删除 ${deleted} 个版本，保留最新 ${KEEP} 个带 ${IMAGE_PREFIX} tag 的版本"
          echo "共删除 ${deleted} 个版本" >> "$SUMMARY"