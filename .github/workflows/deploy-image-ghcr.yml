name: Build deploy image (GHCR)

on:
  push:
    tags:
      - 'deploy*'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "deploy"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.sha }}

      - name: Resolve image tags
        id: tags
        run: |
          OWNER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${OWNER}/new-api"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${IMAGE}:deploy" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:deploy-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=deploy-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: echo "${{ steps.tags.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.tags.outputs.image }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.deploy_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.deploy_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old image versions (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="new-api"
          KEEP=3
          # 先拉取全部 versions（--paginate 拼接数组），再本地 jq 处理
          # 避免 --paginate + --jq 逐页处理的 bug（gh cli#10459）
          gh api --paginate "/user/packages/container/${IMAGE}/versions?per_page=100" \
            > /tmp/versions.json 2>/tmp/prune_fetch_err.txt || {
              echo "::warning::无法列出镜像版本 ($(cat /tmp/prune_fetch_err.txt))，跳过清理"
              exit 0
            }
          jq -r 'sort_by(.created_at) | reverse | .[] | [.id, ([.metadata.container.tags[]?] | join(",")), .created_at] | @tsv' \
            /tmp/versions.json > /tmp/versions.tsv 2>/tmp/prune_jq_err.txt || {
              echo "::warning::解析版本列表失败 ($(cat /tmp/prune_jq_err.txt))，跳过清理"
              exit 0
            }
          total=$(wc -l < /tmp/versions.tsv)
          echo "发现 ${total} 个镜像版本"
          echo "### Prune old image versions (keep newest ${KEEP})" >> "$GITHUB_STEP_SUMMARY"
          echo "共 ${total} 个镜像版本" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/versions.tsv >> "$GITHUB_STEP_SUMMARY"
          deploy_id=$(awk -F'\t' '$2 ~ /(^|,)deploy(,|$)/ {print $1}' /tmp/versions.tsv | head -1)
          echo "deploy tag holder version id: ${deploy_id:-无}"
          echo "deploy tag holder version id: ${deploy_id:-无}" >> "$GITHUB_STEP_SUMMARY"
          i=0
          deleted=0
          while IFS=$'\t' read -r id tags created; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ] || [ "$id" = "$deploy_id" ]; then
              echo "保留 version $id (tags: $tags, created: $created)"
              echo "KEEP  version $id (tags: $tags, created: $created)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if gh api --method DELETE "/user/packages/container/${IMAGE}/versions/${id}" --silent 2>/tmp/prune_err.txt; then
              echo "已删除 version $id (tags: $tags, created: $created)"
              echo "DELETE version $id (tags: $tags, created: $created)" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
            else
              echo "::warning::删除 version $id 失败: $(cat /tmp/prune_err.txt)"
              echo "DELETE FAILED version $id: $(cat /tmp/prune_err.txt)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < /tmp/versions.tsv
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "保留 ${KEEP} 个最新版本 + deploy holder，共删除 ${deleted} 个版本"
          echo "共删除 ${deleted} 个版本" >> "$GITHUB_STEP_SUMMARY"