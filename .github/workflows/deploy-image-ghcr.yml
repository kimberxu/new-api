name: Build deploy image (GHCR)

on:
  push:
    tags:
      - 'deploy*'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "deploy"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.sha }}

      - name: Resolve image tags
        id: tags
        run: |
          OWNER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${OWNER}/new-api"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${IMAGE}:deploy" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:deploy-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=deploy-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write VERSION
        run: echo "${{ steps.tags.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.tags.outputs.image }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.deploy_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.deploy_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old image versions (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="new-api"
          KEEP=3
          # 所有版本按创建时间降序；deploy 滚动 tag 总指向最新构建，
          # 必然落在前 KEEP 内，此处仍显式保护以防异常。
          gh api --paginate "/user/packages/container/${IMAGE}/versions?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[] | [.id, ([.metadata.container.tags[]?] | join(","))] | @tsv' \
            > /tmp/versions.tsv || {
              echo "::warning::无法列出镜像版本，跳过清理"
              exit 0
            }
          if [ ! -s /tmp/versions.tsv ]; then
            echo "没有可清理的镜像版本"
            exit 0
          fi
          deploy_id=$(awk -F'\t' '$2 ~ /(^|,)deploy(,|$)/ {print $1}' /tmp/versions.tsv | head -1)
          i=0
          deleted=0
          while IFS=$'\t' read -r id tags; do
            i=$((i + 1))
            if [ "$i" -le "$KEEP" ] || [ "$id" = "$deploy_id" ]; then
              echo "保留 version $id (tags: $tags)"
              continue
            fi
            if gh api --method DELETE "/user/packages/container/${IMAGE}/versions/${id}" --silent 2>/tmp/prune_err.txt; then
              echo "已删除 version $id (tags: $tags)"
              deleted=$((deleted + 1))
            else
              echo "::warning::删除 version $id 失败: $(cat /tmp/prune_err.txt)"
            fi
          done < /tmp/versions.tsv
          echo "清理完成，共删除 ${deleted} 个版本"